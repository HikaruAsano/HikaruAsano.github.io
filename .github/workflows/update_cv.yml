name: Update CV

on:
  push:
    branches:
      - main
    paths:
      - "_data/**"
      - "index.md"
      - "scripts/generate_cv.py"

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate LaTeX source
        run: python scripts/generate_cv.py

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: hikaru_asano_cv.tex
          working_directory: cv
          latexmk_shell_escape: false
          extra_system_packages: "py-pygments"

      - name: Copy PDF to assets
        run: cp cv/hikaru_asano_cv.pdf assets/files/CV.pdf

      - name: Commit updated CV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv/hikaru_asano_cv.tex assets/files/CV.pdf
          git diff --staged --quiet || git commit -m "Auto-update CV [skip ci]"
          git push
